[package]
name = "desc_sequence"
version = "0.1.0"
edition = "2021"
authors = ["Thomas Steimlé <https://github.com/Dr-TSteimle>"]
# Vendored from https://github.com/Dr-TSteimle/desc_sequence to fix rust-htslib version mismatch.
# Original used rust-htslib 0.49, but bwa uses 0.51. Updated to 0.51 for compatibility.
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
duct = "0.13.7"
bwa = { git = "https://github.com/Dr-TSteimle/rust-bwa" }
rust-htslib = { version = "0.51", default-features = false, features = ["serde_feature"] }
